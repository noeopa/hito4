<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento del Trabajo de Título</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <h2>SGM · Trabajos de Título</h2>
    <a href="seguimiento.html">Seguimiento (Memorista)</a>
    <a href="anotacion.html">Anotaciones (Guía)</a>
    <a href="propuestas.html">Propuestas (Jefe de Carrera)</a>
  </div>

  <div class="content">
    <h1>Seguimiento del Trabajo de Título</h1>
    <p class="subtitle">Consulta el estado actual de tu Trabajo de Título.</p>

    <div class="card">
      <label>ID del Trabajo de Título:</label>
      <input type="number" id="trabajoId" value="1">
      <button onclick="consultarEstado()">Consultar</button>
    </div>

    <div class="card" id="resultado" style="display:none;">
      <h3 id="nombre"></h3>
      <p>Estado: <strong id="estado"></strong></p>
    </div>
    <p class="error" id="error"></p>
  </div>

  <script>
    function consultarEstado() {
      const id = document.getElementById("trabajoId").value;
      document.getElementById("error").textContent = "";

      fetch(`http://localhost:8081/api/trabajos/${id}/estado`)
        .then(response => {
          if (!response.ok) throw new Error("No se encontró el Trabajo de Título");
          return response.json();
        })
        .then(data => {
          document.getElementById("resultado").style.display = "block";
          document.getElementById("nombre").textContent = data.nombre;
          document.getElementById("estado").textContent = data.estado;
        })
        .catch(err => {
          document.getElementById("resultado").style.display = "none";
          document.getElementById("error").textContent = err.message;
        });
    }
  </script>
</body>
</html>

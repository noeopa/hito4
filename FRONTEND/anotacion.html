<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Anotación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <h2>SGM · Trabajos de Título</h2>
    <a href="seguimiento.html">Seguimiento (Memorista)</a>
    <a href="anotacion.html">Anotaciones (Guía)</a>
    <a href="propuestas.html">Propuestas (Jefe de Carrera)</a>
  </div>

  <div class="content">
    <h1>Registrar anotación</h1>
    <p class="subtitle">Asocia una anotación a una versión del Trabajo de Título.</p>

    <div class="card">
      <label>ID de la versión:</label>
      <input type="number" id="versionId" value="1">
      <label>ID del Guía (autor):</label>
      <input type="number" id="guiaId" value="1">
      <label>Comentario:</label>
      <textarea id="comentario" rows="4"></textarea>
      <button onclick="registrarAnotacion()">Guardar anotación</button>
    </div>

    <div class="card" id="resultado" style="display:none;">
      <p class="success">Anotación registrada con éxito</p>
      <p>Comentario: <span id="rComentario"></span></p>
      <p>Autor (Guía): <span id="rGuia"></span></p>
      <p>Fecha: <span id="rFecha"></span></p>
    </div>
    <p class="error" id="error"></p>
  </div>

  <script>
    function registrarAnotacion() {
      const versionId = document.getElementById("versionId").value;
      const guia_id = document.getElementById("guiaId").value;
      const comentario = document.getElementById("comentario").value;
      document.getElementById("error").textContent = "";

      fetch(`http://localhost:8081/api/versiones/${versionId}/anotaciones`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comentario, guia_id })
      })
        .then(response => {
          if (!response.ok) throw new Error("No se pudo registrar la anotación");
          return response.json();
        })
        .then(data => {
          document.getElementById("resultado").style.display = "block";
          document.getElementById("rComentario").textContent = data.comentario;
          document.getElementById("rGuia").textContent = data.guia_id;
          document.getElementById("rFecha").textContent = data.fecha;
        })
        .catch(err => {
          document.getElementById("resultado").style.display = "none";
          document.getElementById("error").textContent = err.message;
        });
    }
  </script>
</body>
</html>

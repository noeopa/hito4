<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aprobar Propuesta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <h2>SGM · Trabajos de Título</h2>
    <a href="seguimiento.html">Seguimiento (Memorista)</a>
    <a href="anotacion.html">Anotaciones (Guía)</a>
    <a href="propuestas.html">Propuestas (Jefe de Carrera)</a>
  </div>

  <div class="content">
    <h1>Aprobar propuesta</h1>
    <p class="subtitle">Aprueba una Propuesta de Trabajo de Título pendiente.</p>

    <div class="card">
      <label>ID de la propuesta:</label>
      <input type="number" id="propuestaId" value="1">
      <button onclick="aprobarPropuesta()">Aprobar propuesta</button>
    </div>

    <div class="card" id="resultado" style="display:none;">
      <h3 id="nombreTema"></h3>
      <p>Estado: <strong id="estadoAprobacion"></strong></p>
    </div>
    <p class="error" id="error"></p>
  </div>

  <script>
    function aprobarPropuesta() {
      const id = document.getElementById("propuestaId").value;
      document.getElementById("error").textContent = "";

      fetch(`http://localhost:8080/api/propuestas/${id}/aprobar`, { method: "PUT" })
        .then(response => {
          if (!response.ok) throw new Error("No se encontró la propuesta");
          return response.json();
        })
        .then(data => {
          document.getElementById("resultado").style.display = "block";
          document.getElementById("nombreTema").textContent = data.nombre_tema;
          document.getElementById("estadoAprobacion").textContent = data.estado_aprobacion;
        })
        .catch(err => {
          document.getElementById("resultado").style.display = "none";
          document.getElementById("error").textContent = err.message;
        });
    }
  </script>
</body>
</html>
